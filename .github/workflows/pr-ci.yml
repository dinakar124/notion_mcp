# PR CI — Deterministic tests only. No real Notion credentials.
name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.7"

jobs:
  lint-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Format check
        run: deno task fmt:check
      - name: Lint
        run: deno task lint
      - name: Type check
        run: deno task check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-check
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: notion_mcp
          POSTGRES_PASSWORD: notion_mcp_dev
          POSTGRES_DB: notion_mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notion_mcp -d notion_mcp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Run unit tests
        run: deno task test:unit
      - name: Run integration tests
        run: deno task test:integration
        env:
          DATABASE_URL: postgresql://notion_mcp:notion_mcp_dev@localhost:5432/notion_mcp
          REDIS_URL: redis://localhost:6379

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Gitleaks — secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  docker-scan:
    name: Docker Image Build & Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: notion-fake
            context: ./test-support/notion-fake
          - name: jwks-issuer
            context: ./test-support/jwks-issuer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build ${{ matrix.image.name }} image
        run: |
          docker build \
            -t notion-mcp/${{ matrix.image.name }}:ci \
            -f ${{ matrix.image.context }}/Dockerfile \
            ${{ matrix.image.context }}
      - name: Trivy — image vulnerability scan (${{ matrix.image.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "notion-mcp/${{ matrix.image.name }}:ci"
          scan-type: "image"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Trivy — image secret scan (${{ matrix.image.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "notion-mcp/${{ matrix.image.name }}:ci"
          scan-type: "image"
          scanners: "secret"
          exit-code: "1"

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Syft — generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: "."
          format: "cyclonedx-json"
          output-file: "sbom.cdx.json"
      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: sbom.cdx.json
